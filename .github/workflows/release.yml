name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add ${{ matrix.target }}
      - run: PROMPTVPN_RELEASE_KEY=/nonexistent scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums and signature
        env:
          RELEASE_SSH_KEY: ${{ secrets.PROMPTVPN_RELEASE_SSH_KEY }}
        run: |
          cd dist && sha256sum promptvpn-*.tar.gz > SHA256SUMS
          umask 077 && printf '%s\n' "$RELEASE_SSH_KEY" > /tmp/k
          ssh-keygen -q -Y sign -f /tmp/k -n promptvpn-release SHA256SUMS && rm /tmp/k
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
