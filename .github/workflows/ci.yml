name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret Service for keyring tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Dashboard
        working-directory: apps/dashboard
        run: npm ci && npm run gen:types && git diff --exit-code src/generated && npx tsc --noEmit && npm run build
      - name: Schemas are current
        run: cargo run -q -p pv-cli -- schema --out schemas && git diff --exit-code schemas
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Skill adapters are current
        run: python3 -I scripts/gen_skill_adapters.py . && git diff --exit-code skills
      - name: Skill script tests
        run: cargo build -p pv-cli && sh skills/promptvpn-setup/tests/run.sh </dev/null
      - name: Evaluation (privacy gate, deterministic + GLiNER sizes)
        run: |
          python3 -I scripts/gen_eval_corpus.py > tests/fixtures/eval_corpus.jsonl
          cargo run -q -p pv-cli -- eval --configs deterministic --out eval.json
          python3 -I -c "import json; r=json.load(open('eval.json'))[0]; print(r['critical_escapes'], r['false_block_rate']); assert r['critical_escapes'] <= 1 and r['false_block_rate'] == 0"
          for s in edge small base; do PV_HOME=$PWD/.ci cargo run -q -p pv-cli -- daemon --port 8787 & sleep 5; PV_HOME=$PWD/.ci cargo run -q -p pv-cli -- model install $s || true; kill %1 || true; done
          cargo run -q -p pv-cli -- eval --configs all --models-dir .ci/models --out eval-all.json
          python3 -I -c "import json; [print(r['config'], r['critical_escapes'], r['false_block_rate'], r['decision_accuracy']) for r in json.load(open('eval-all.json'))]; assert all(r['critical_escapes'] <= 1 and r['false_block_rate'] <= 0.02 for r in json.load(open('eval-all.json')))"
